# Les outils du venv du projet : pas de version à tenir à jour en double.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy src tests
        language: system
        pass_filenames: false
        types: [python]
